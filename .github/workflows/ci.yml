name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Both generated artifacts are committed. The grammar because GitHub
      # Linguist reads it straight from this repository and runs no build step;
      # the spec model because packages/core must run in a browser worker, where
      # there is no filesystem to read a registry from. If regenerating either
      # produces a diff, the committed copy is stale.
      - name: Generated artifacts are up to date with the pinned registry
        run: |
          npx vp run grammar
          npx vp run spec
          git diff --exit-code -- syntaxes/gedcom.tmLanguage.json packages/core/src/spec/model.generated.ts

      - name: Test
        run: npx vp test

      - name: Lint, format and type-check
        run: npx vp check

      - name: Bundle both extension hosts
        run: npx vp run build

      - name: Integration tests in a real VS Code
        run: xvfb-run -a npx vscode-test --label stable

      # The build bug reports arrive from. Issue #5 came from Insiders on Linux
      # and nothing here had ever run against Insiders at all, so the one
      # environment a user was reporting from was the one combination untested.
      #
      # Advisory, not blocking: Insiders is whatever was built that day, and a
      # release of this extension must not be at the mercy of it. A failure here
      # is a lead to follow — which is the whole point of running it.
      - name: Integration tests in VS Code Insiders
        continue-on-error: true
        run: xvfb-run -a npx vscode-test --label insiders

      # The other host, which the Electron harness cannot reach: the extension
      # runs as a web worker with no Node builtins, the server in a nested worker
      # loaded by URL, and the panel under a stricter content security policy.
      # This is where a bundle that cannot be loaded at all shows up.
      - name: Integration tests in the web extension host
        run: |
          npx playwright install --with-deps chromium
          npx vscode-test-web --browser=chromium --headless --quality=stable \
            --extensionDevelopmentPath=. \
            --extensionTestsPath=./dist/web-tests/index.cjs \
            fixtures

      # Named as `vsce` would name it, which is the name the extension answers
      # to everywhere else: `vscode-gedcom-<version>.vsix`.
      - name: Package
        run: npx --yes @vscode/vsce package --no-git-tag-version

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error
